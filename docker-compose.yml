version: '3.8'

services:
  coredefend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: coredefend-scanner
    ports:
      - "8501:8501"
    restart: unless-stopped

    # Network mode host for full network scanning capabilities
    # Uncomment for scanning the host network directly
    # network_mode: host

    # For scanning external targets, use bridge mode (default)
    networks:
      - scanner-net

    # Optional: Add capabilities for advanced scans
    cap_add:
      - NET_RAW
      - NET_ADMIN

    # Resource limits
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 256M

    # Environment variables
    environment:
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
      - STREAMLIT_BROWSER_GATHER_USAGE_STATS=false

    # Health check
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

networks:
  scanner-net:
    driver: bridge
